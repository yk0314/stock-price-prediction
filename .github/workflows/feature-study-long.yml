name: JP Stock AI Feature Study Long (J-Quants)

on:
  # 長い期間(約5年)の日足を、J-Quantsから日付ごとに直接取って、値動き・出来高の数字そのものの順位づけの力を検証する。
  # D1は使わない(読み取りも書き込みも無い)。J-Quantsには、GETしか送らない。手動実行のみ。自動実行は追加しない。
  # 5年(約1,230営業日)で、毎分60回のレート制限なら、約26〜30分かかる。
  # 17:10 JST から始まる通常のパイプライン(約90分)と、同時に動かさない(J-Quantsのレート制限は、APIキー単位で共有される)。週末か午前に実行する。
  # 試しに短く動かすなら、from に 2026-03-02 などを指定する(約5分)。
  workflow_dispatch:
    inputs:
      from:
        description: "取得の開始日(YYYY-MM-DD)。省略時は 2021-11-22(契約の範囲の始まり)"
        required: false
        default: ""
      holdoutFrom:
        description: "確認期間の開始日(YYYY-MM-DD)。これより前が探索期間。省略時は 2024-07-01"
        required: false
        default: ""
      costPct:
        description: "往復コスト(%)。省略時は 0.3"
        required: false
        default: ""
      minTurnoverOku:
        description: "流動性の足切り: 直近20日の平均売買代金(億円)。省略時は 1"
        required: false
        default: ""
      horizons:
        description: "保有日数(営業日)をカンマ区切りで。省略時は 1,3,5,10,20(半角のカンマ)"
        required: false
        default: ""

jobs:
  run-feature-study-long:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 検証実行(J-Quantsの読み取りのみ。D1は使わない)
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          # JQUANTS_PLAN: free / light / standard / premium(既定 light)。プランに応じたリクエスト間隔になる
          JQUANTS_PLAN: ${{ vars.JQUANTS_PLAN }}
          FEATURES_FROM: ${{ inputs.from }}
          FEATURES_HOLDOUT_FROM: ${{ inputs.holdoutFrom }}
          FEATURES_COST_PCT: ${{ inputs.costPct }}
          FEATURES_MIN_TURNOVER_OKU: ${{ inputs.minTurnoverOku }}
          FEATURES_HORIZONS: ${{ inputs.horizons }}
        run: node scripts/analyze-features-jquants.js

      - name: 結果(data/)をartifactとしてアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-study-long-${{ github.run_id }}
          path: data/
          retention-days: 30
          if-no-files-found: ignore

name: JP Stock AI Pipeline

on:
  # 平日 17:00 JST (= 08:00 UTC) に自動実行する。ランキングの「今日」の切り替え(JST 17:00)と同じ時刻。
  # GitHub Actionsのscheduleは数分〜数十分遅れることがある。
  # scheduleはデフォルトブランチ(main)のワークフローだけが対象になる。
  schedule:
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
    inputs:
      cutoffDate:
        description: "cutoffDate (YYYY-MM-DD)。省略時は「実行日-90日」を自動計算します。"
        required: false
        default: ""
      universeMode:
        description: "対象銘柄範囲。phase1_subset=10銘柄固定 / all=全銘柄（約4,400）"
        required: false
        type: choice
        options:
          - phase1_subset
          - all
        default: phase1_subset

# 同じworkflowの二重実行を防ぐ。実行中に手動実行や次のscheduleが重なった場合は、
# 実行中のものを中断せず、後続を待機させる。
concurrency:
  group: stock-ai-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # 全銘柄モードのデータ取得(約15分) + 財務取得(約38分) + Gemini 150銘柄×30秒間隔(約76分以上)
    # + 429/503リトライの余裕を見込んで240分。
    # (1銘柄ごとにD1へ即時保存しているため、強制終了時もそこまでの成功分は失われない。)
    timeout-minutes: 240
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: パイプライン実行
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CUTOFF_DATE: ${{ inputs.cutoffDate }}
          # schedule実行ではinputsが空になるため、その場合だけ全銘柄(all)にする。
          # 手動実行(workflow_dispatch)では入力値がそのまま使われる(既定はphase1_subset)。
          UNIVERSE_MODE: ${{ inputs.universeMode || 'all' }}
          # --- Gemini関連の外部設定値 ---
          # 以前はconfig.js側でprocess.env.GEMINI_MAX_STOCKS等を読む実装だけがあり、
          # ここ(ワークフロー定義)でリポジトリ変数をenvへ配線していなかったため、
          # Settings > Variables に値を設定しても実行時には一切反映されず、
          # 常にconfig.js側のデフォルト値(例: candidateCount=10)にフォールバックしていた。
          # vars.*が未設定の場合は空文字列になり、config.js側の`Number("") || デフォルト値`で
          # 従来通り安全なデフォルト値にフォールバックするため、この変更単体で既存の挙動を壊さない。
          GEMINI_MAX_STOCKS: ${{ vars.GEMINI_MAX_STOCKS }}
          GEMINI_REQUEST_INTERVAL_MS: ${{ vars.GEMINI_REQUEST_INTERVAL_MS }}
          GEMINI_MAX_RETRIES: ${{ vars.GEMINI_MAX_RETRIES }}
          GEMINI_RETRY_BACKOFF_BASE_MS: ${{ vars.GEMINI_RETRY_BACKOFF_BASE_MS }}
          GEMINI_429_BACKOFF_MS: ${{ vars.GEMINI_429_BACKOFF_MS }}
          GEMINI_CONSECUTIVE_429_LIMIT: ${{ vars.GEMINI_CONSECUTIVE_429_LIMIT }}
          GEMINI_DAILY_REQUEST_LIMIT: ${{ vars.GEMINI_DAILY_REQUEST_LIMIT }}
        run: node src/pipeline.js

      # raw-data / normalized-data / features / screened / gemini-results / ranking の
      # 各段階の中間データをartifactとして保存する。失敗時も原因調査できるよう常にアップロードする。
      - name: 中間データ(data/)をartifactとしてアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-data-${{ github.run_id }}
          path: data/
          retention-days: 14
          if-no-files-found: ignore

name: JP Stock AI Backtest (D1)

on:
  # D1を読み取るだけの検証(書き込みはしない)。手動実行のみ。自動実行は追加しない。
  workflow_dispatch:
    inputs:
      from:
        description: "この基準日(YYYY-MM-DD)以降のAI評価だけを使う(省略時は最初の評価から)"
        required: false
        default: ""
      horizons:
        description: "保有日数(営業日)をカンマ区切りで指定(省略時は 1,3,5)"
        required: false
        default: ""
      costPct:
        description: "往復の手数料・価格差の合計(%)。省略時は0"
        required: false
        default: ""
      top:
        description: "毎日のスコア上位N件(省略時は10)"
        required: false
        default: ""
      maxStaleDays:
        description: "評価の基準日が、生成された日よりこの日数より前のものは除外する(省略時は5)"
        required: false
        default: ""
      exitAt:
        description: "売る価格。open = 保有日数後の始値(既定。日中に取引できない使い方に合わせる) / close = 保有日数目の終値(比較用)"
        required: false
        type: choice
        default: "open"
        options:
          - "open"
          - "close"
      holdoutFrom:
        description: "確認期間の開始日(基準日がこの日以降の評価だけで、事前に固定した選び方を確認する。省略時は 2026-10-19)"
        required: false
        default: ""
      scoreCuts:
        description: "スコアの水準を分ける区切りをカンマ区切りで指定(省略時は 62,68,72。最上位の水準 − それ以外も出る)"
        required: false
        default: ""

jobs:
  run-backtest-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: バックテスト実行(D1は読み取りのみ)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          BACKTEST_FROM: ${{ inputs.from }}
          BACKTEST_HORIZONS: ${{ inputs.horizons }}
          BACKTEST_COST_PCT: ${{ inputs.costPct }}
          BACKTEST_TOP: ${{ inputs.top }}
          BACKTEST_MAX_STALE_DAYS: ${{ inputs.maxStaleDays }}
          BACKTEST_SCORE_CUTS: ${{ inputs.scoreCuts }}
          BACKTEST_EXIT_AT: ${{ inputs.exitAt }}
          BACKTEST_HOLDOUT_FROM: ${{ inputs.holdoutFrom }}
        run: node scripts/backtest-d1.js

      - name: 結果(data/)をartifactとしてアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-d1-${{ github.run_id }}
          path: data/
          retention-days: 30
          if-no-files-found: ignore

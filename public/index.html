<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>日本株AI短期売買分析ツール</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>日本株AI短期売買分析ツール</h1>
    <p id="meta-info" class="meta-info">読み込み中...</p>
    <p class="disclaimer">
      本サイトの評価はAIによる参考情報です。表示されるスコア・期待リターン・リスクは
      統計的に校正された確率ではなく、AIによる定性的な評価値です。このツールは自動で売買を行うものではありません。
      投資判断はご自身の責任で行ってください。投資利益を保証するものではありません。
    </p>
  </header>

  <main>
    <!-- ランキング画面 -->
    <section id="view-ranking" class="view">
      <div class="section-head">
        <h2>AI評価ランキング</h2>
        <button id="ranking-reload" class="reload-button" title="再読み込み">更新</button>
      </div>
      <div id="ranking-list" class="ranking-grid" aria-live="polite">読み込み中...</div>
    </section>

    <!-- 銘柄詳細画面（次のステップで中身を実装） -->
    <section id="view-detail" class="view" hidden>
      <button id="back-to-ranking" class="back-button">← ランキングに戻る</button>
      <div id="detail-content" aria-live="polite">読み込み中...</div>
    </section>
  </main>

  <footer>
    <p>
      表示されているデータは、実際に取得可能だった時点（データ基準日 / dataAsOf）の情報です。
      J-Quants Freeプランの仕様上、常に実行日から約3ヶ月前までのデータとなります。
    </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>

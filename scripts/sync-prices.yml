name: Sync Prices (J-Quants to D1)

# J-Quantsの全銘柄の日足・TOPIX・銘柄マスタを、D1へ差分で蓄積する(バックテスト用データの蓄積)。
# 毎日 18:30 JST (= 09:30 UTC)。J-Quantsの株価は日本時間16:30頃、上場銘柄一覧は17:30頃に更新される。
# 取引のない日は、新しい取引日が無いため何も書き込まずに終わる。
# 事前に migrations/0004_jquants_paid_data_foundation.sql をD1へ適用しておくこと。
on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      lookbackDays:
        description: "蓄積を始める日付(何暦日前から)。省略時はリポジトリ変数 PRICE_SYNC_LOOKBACK_DAYS、無ければ730日"
        required: false
        default: ""
      writeBudget:
        description: "この実行で使うD1の書き込み行数の上限。省略時はリポジトリ変数 D1_DAILY_WRITE_BUDGET、無ければ60000(無料枠は1日10万行)"
        required: false
        default: ""

# パイプライン(pipeline.yml)と同じグループにして、D1への書き込みが同時に走らないようにする
concurrency:
  group: stock-ai-pipeline
  cancel-in-progress: false

jobs:
  sync-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 株価・TOPIX・銘柄マスタをD1へ蓄積
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          JQUANTS_PLAN: ${{ vars.JQUANTS_PLAN }}
          PRICE_SYNC_LOOKBACK_DAYS: ${{ inputs.lookbackDays || vars.PRICE_SYNC_LOOKBACK_DAYS }}
          D1_DAILY_WRITE_BUDGET: ${{ inputs.writeBudget || vars.D1_DAILY_WRITE_BUDGET }}
        run: node scripts/sync-prices.js
